<!doctype html>
<html lang="zh-CN">
<head>

  <title>第三声以后 · Sth 样稿</title>
  <style>
    :root {
      --library-width: 208px;

      color: var(--ink);
      font: 13px/1.5 var(--sans);
      background: var(--paper);
      accent-color: var(--accent);
      scrollbar-color: #c3c9c2 transparent;
      scrollbar-width: thin;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, summary, select { -webkit-tap-highlight-color: transparent; }

    button { border: 0; background: transparent; }
    button:disabled { opacity: .45; cursor: default; }
    button, a, input, select, summary, textarea { outline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); }
    ::selection { background: #d8e8dc; color: #172b20; }
    [hidden] { display: none !important; }
    svg { display: block; inline-size: 18px; block-size: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .sprite { position: absolute; inline-size: 0; block-size: 0; }

    .panel { display: flex; flex-direction: column; min-inline-size: 0; min-block-size: 0; }
    .library { background: var(--library); border-inline-end: 1px solid #d9dcd6; }
    .sheets { background: var(--list); border-inline-end: 1px solid var(--line); }
    .chrome { min-block-size: 52px; display: flex; align-items: center; gap: 8px; padding-inline: 16px; flex: 0 0 auto; }
    .brand { display: flex; align-items: center; gap: 9px; color: #244b39; font: 600 25px Georgia, serif; letter-spacing: -.6px; }
    .brand svg { inline-size: 21px; block-size: 21px; stroke-width: 1.5; }
    .icon-button { display: inline-flex; align-items: center; justify-content: center; min-inline-size: 32px; min-block-size: 32px; padding: 6px; border-radius: 5px; color: #626d65; }

    .push { margin-inline-start: auto; }

    .library-scroll { flex: 1; padding: 22px 10px; }

    .nav-row svg { inline-size: 17px; block-size: 17px; color: #69766b; }
    .nav-row:hover { background: #e4e7e0; }

    .nav-row[aria-current="page"] svg { color: #285a46; }

    .book > summary::-webkit-details-marker { display: none; }
    .book > summary .caret { inline-size: 12px; block-size: 12px; margin-inline-start: auto; }
    .book[open] > summary .caret { transform: rotate(90deg); }
    .book .nav-row { padding-inline-start: 36px; font-size: 12px; }
    .book .nav-row svg { inline-size: 14px; block-size: 14px; }
    .library-footer { padding: 12px 15px 14px; color: var(--muted); border-block-start: 1px solid #dee2da; font-size: 11px; display: flex; align-items: center; gap: 7px; }
    .library-footer svg { inline-size: 14px; block-size: 14px; }
    .list-chrome { justify-content: space-between; padding-inline: 19px 13px; }
    .list-chrome h1 { margin: 0; font-size: 13px; font-weight: 600; }
    .list-mobile-back, .tablet-library { display: none; }
    .list-heading { padding: 19px 21px 12px; }
    .list-heading h2 { margin: 0 0 4px; font-size: 19px; font-weight: 600; letter-spacing: -.3px; }
    .list-heading p { margin: 0; color: var(--muted); font-size: 11px; }
    .search { margin: 0 15px 13px; border: 1px solid #e2e5de; background: #f0f2ec; border-radius: 5px; display: flex; align-items: center; padding-inline: 9px; gap: 7px; }
    .search svg { inline-size: 14px; block-size: 14px; color: #6c776d; }
    .search input { min-inline-size: 0; inline-size: 100%; min-block-size: 30px; background: transparent; border: 0; outline-offset: 0; font-size: 12px; }
    input::placeholder, textarea::placeholder { color: #5e685e; opacity: 1; }
    .list-filter { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 10px; border-block-end: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .filter-button { display: inline-flex; align-items: center; gap: 4px; padding: 3px 0; }
    .filter-button svg { inline-size: 12px; block-size: 12px; }

    .sheet-scroll { flex: 1; }

    .empty-list { padding: 30px 21px; color: var(--muted); }

    .editor-chrome { border-block-end: 1px solid #e9ebe6; padding-inline: 22px 17px; }

    .breadcrumbs span { overflow: clip; text-overflow: ellipsis; white-space: nowrap; min-inline-size: 0; }
    .breadcrumbs svg { inline-size: 11px; block-size: 11px; }
    .text-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-block-size: 30px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; font-size: 12px; color: #59675c; }
    .text-button svg { inline-size: 16px; block-size: 16px; }
    .text-button[aria-pressed="true"] { color: var(--accent); background: #e9f0e8; }
    .mobile-back { display: none; }
    .more { position: relative; }
    .more summary { list-style: none; cursor: pointer; }
    .more summary::-webkit-details-marker { display: none; }
    .menu { position: absolute; inset-block-start: 38px; inset-inline-end: 0; z-index: 5; inline-size: 210px; padding: 6px; border-radius: 8px; background: white; box-shadow: 0 6px 24px #263b2526; }
    .menu button, .menu a { display: flex; align-items: center; gap: 9px; inline-size: 100%; padding: 10px; border-radius: 4px; text-align: start; font-size: 12px; text-decoration: none; color: var(--ink); }
    .menu button:hover, .menu a:hover { background: #edf2e9; }
    .menu hr { border: 0; border-block-start: 1px solid var(--line); margin: 5px 6px; }
    .draftbar { display: flex; align-items: center; gap: 9px; min-block-size: 43px; padding-inline: 25px 23px; color: var(--muted); flex: 0 0 auto; }
    .select-wrap { display: flex; align-items: center; gap: 4px; min-inline-size: 0; }
    select { border: 0; background: transparent; font-size: 11px; max-inline-size: 160px; min-block-size: 30px; cursor: pointer; }
    #revision { max-inline-size: 73px; }
    .draftbar-separator { block-size: 12px; border-inline-start: 1px solid var(--line); }
    .draftbar .text-button { font-size: 11px; }
    .reading-scroll { flex: 1; scrollbar-gutter: stable; scroll-behavior: auto; }
    .manuscript { inline-size: min(100% - 112px, 36em); margin-inline: auto; padding-block: 29px 100px; font-size: 18px; }
    .manuscript h1 { font: 600 27px/1.55 var(--sans); letter-spacing: -.5px; margin: 0 0 11px; overflow-wrap: anywhere; }
    .manuscript-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; color: var(--muted); font: 11px/1.8 var(--sans); margin-block-end: 34px; }
    .manuscript-meta .state { color: var(--accent); }
    .prose, .edit-body { font: 400 18px/1.85 var(--serif); letter-spacing: .015em; overflow-wrap: anywhere; }
    .sans .prose, .sans .edit-body { font-family: var(--sans); line-height: 1.8; letter-spacing: 0; }
    .prose p { margin: 0 0 1.25em; scroll-margin-block: 24px; }
    .prose p.target { background: #f5f1d9; box-shadow: 0 0 0 6px #f5f1d9; border-radius: 1px; }
    .selection-note { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; color: #6b653d; font: 11px/1.5 var(--sans); margin-block-end: 25px; }
    .selection-note button { text-decoration: underline; text-underline-offset: 3px; font-size: 11px; color: inherit; }
    .old-version { background: #f7f4e9; padding: 9px 25px; display: flex; gap: 8px; align-items: center; font-size: 11px; flex: 0 0 auto; color: #72633d; }
    .old-version button { color: #655129; text-decoration: underline; text-underline-offset: 3px; margin-inline-start: auto; white-space: nowrap; }
    .editor-footer { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; min-block-size: 35px; border-block-start: 1px solid #edf0e9; padding: 8px 25px max(8px, env(safe-area-inset-bottom)); color: #70796f; font-size: 10px; font-variant-numeric: tabular-nums; }
    .editor-footer button { color: inherit; padding: 0; font-size: 10px; }
    .editor-footer button:hover { color: var(--accent); }
    .edit-body { display: block; inline-size: 100%; min-block-size: 460px; resize: vertical; padding: 10px; margin: -10px; inline-size: calc(100% + 20px); border: 1px solid #b4c4b6; border-radius: 2px; background: #fdfefb; caret-color: var(--accent); }
    .primary { background: var(--accent); color: white; }
    .primary:hover { background: #1f4936; color: white; }
    .no-manuscript { color: var(--muted); font-size: 15px; line-height: 1.9; }
    .no-manuscript button { margin-block-start: 12px; }
    .evidence { background: #fafbf8; border-inline-start: 1px solid var(--line); }
    .evidence .chrome { border-block-end: 1px solid var(--line); padding-inline: 21px 12px; }
    .evidence .chrome h2 { margin: 0; font-size: 13px; font-weight: 600; }
    .evidence-scroll { padding: 23px 23px 40px; flex: 1; }
    .evidence-context { color: var(--muted); font-size: 11px; margin: 0 0 28px; line-height: 1.9; }
    .evidence-section { margin-block-end: 30px; }
    .evidence-section h3 { display: flex; gap: 7px; align-items: center; margin: 0 0 13px; font-size: 12px; font-weight: 600; }
    .evidence-section h3 svg { inline-size: 15px; block-size: 15px; color: #68766a; }
    .evidence-section blockquote { margin: 0 0 11px; font: 15px/1.9 var(--serif); color: #394c3f; }
    .evidence-source { color: #667467; font-size: 11px; }
    .evidence-section p { font-size: 12px; line-height: 1.9; margin: 0 0 9px; }
    .evidence-section details { font-size: 11px; color: #657163; }
    .evidence-section summary { cursor: pointer; padding-block: 6px; }
    .evidence-section details p { padding-block-start: 7px; }
    .evidence-footnote { border-block-start: 1px solid var(--line); padding-block-start: 15px; color: #626d60; font-size: 10px; line-height: 1.8; }
    .workspace[data-evidence="true"] { grid-template-columns: var(--list-width) minmax(0, 1fr) 296px; }
    .workspace[data-evidence="true"] .library { display: none; }
    .workspace[data-focus="true"] { grid-template-columns: minmax(0, 1fr); }
    .workspace[data-focus="true"] .library, .workspace[data-focus="true"] .sheets { display: none; }
    .workspace[data-focus="true"][data-evidence="true"] { grid-template-columns: minmax(0, 1fr) 296px; }
    .workspace[data-library="hidden"]:not([data-evidence="true"]):not([data-focus="true"]) { grid-template-columns: var(--list-width) minmax(0, 1fr); }
    .workspace[data-library="hidden"] .library { display: none; }
    .compare-pane { border-inline-start: 1px solid var(--line); background: #fdfefb; }
    .compare-pane .chrome { border-block-end: 1px solid var(--line); }
    .compare-pane .chrome h2 { font-size: 12px; margin: 0; }
    .compare-pane .manuscript { inline-size: min(100% - 70px, 36em); }
    .workspace[data-compare="true"] { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .workspace[data-compare="true"] .library, .workspace[data-compare="true"] .sheets { display: none; }
    .workspace[data-compare="true"] .manuscript { inline-size: min(100% - 80px, 36em); }
    .notice { position: fixed; inset-block-end: 48px; inset-inline-start: 50%; transform: translateX(-50%); z-index: 8; max-inline-size: calc(100% - 32px); inline-size: max-content; padding: 10px 15px; background: #2d4736; color: #fff; border-radius: 6px; box-shadow: 0 4px 18px #20312120; font-size: 12px; }
    @container editor (inline-size < 620px) {
      .manuscript { inline-size: calc(100% - 64px); padding-block-start: 24px; }
      .editor-chrome { padding-inline: 16px 12px; }
      .breadcrumbs { gap: 5px; }
      .breadcrumbs .book-name { display: none; }
      .breadcrumbs > svg { display: none; }
      .text-button { padding-inline: 6px; }
      .draftbar { padding-inline: 26px 20px; gap: 5px; }
    }
    @media (max-width: 1099px) and (min-width: 700px) {
      .workspace { grid-template-columns: var(--list-width) minmax(0, 1fr); }

      .chrome { min-block-size: 52px; }
      .library { border: 0; }
      .library .chrome { padding-inline: 23px 19px; }
      .brand { font-size: 27px; }
      .library-scroll { padding: 18px; }
      .nav-row { min-block-size: 44px; padding-inline: 12px; font-size: 15px; }
      .nav-label { font-size: 12px; }
      .book > summary { min-block-size: 44px; font-size: 15px; }

      .library-footer { font-size: 12px; padding: 18px 27px max(18px, env(safe-area-inset-bottom)); }
      .count { font-size: 12px; }
      .library-hide { display: none; }
      .sheets { border: 0; }
      .list-chrome { justify-content: flex-start; padding-inline: 10px 16px; gap: 3px; }
      .list-chrome h1 { font-size: 13px; }
      .list-chrome > .icon-button:last-child { margin-inline-start: auto; }
      .list-mobile-back { display: inline-flex; }
      .list-heading { padding: 13px 25px 17px; }
      .list-heading h2 { font-size: 24px; }
      .list-heading p { font-size: 12px; }
      .search { margin-inline: 23px; }
      .search input { min-block-size: 36px; font-size: 14px; }
      .list-filter { padding-inline: 25px; font-size: 12px; }
      .filter-button { min-block-size: 33px; }
      .sheet { padding: 19px 25px; }
      .sheet-title { font-size: 16px; }
      .sheet-snippet { font-size: 13px; min-block-size: 46px; }
      .sheet-meta { font-size: 11px; }
      .mobile-back { display: inline-flex; min-inline-size: 40px; margin-inline-start: -8px; }
      .editor-chrome { padding-inline: 10px; gap: 1px; }
      .editor-chrome .breadcrumbs { max-inline-size: 90px; font-size: 11px; }
      .editor-chrome .text-button { min-block-size: 44px; padding-inline: 8px; }
      .editor-chrome .text-button .button-label { display: none; }
      .icon-button { min-inline-size: 40px; min-block-size: 40px; }
      .draftbar { min-block-size: 43px; padding-inline: 20px 16px; gap: 5px; }
      .draftbar .text-button { min-block-size: 38px; font-size: 12px; }
      select { min-block-size: 38px; font-size: 12px; }
      #draft { max-inline-size: 106px; }
      #revision { max-inline-size: 64px; }
      .draftbar-separator { display: none; }
      .manuscript { inline-size: calc(100% - 48px); padding-block: 20px 70px; }
      .manuscript h1 { font-size: 25px; margin-block-end: 9px; }
      .manuscript-meta { font-size: 11px; gap: 7px; margin-block-end: 27px; }
      .prose, .edit-body { font-size: 18px; line-height: 1.85; }
      .prose p { margin-block-end: 1.2em; }
      .editor-footer { padding-inline: 23px; min-block-size: 36px; }
      .old-version { padding-inline: 22px; font-size: 11px; }

      .nav-row[aria-current="page"], .sheet[aria-current="page"] { outline: 1px solid Highlight; outline-offset: -2px; }
      .prose p.target { outline: 2px solid Highlight; }
    }
  </style>
</head>

        titleSpan.className = 'sheet-title';
        titleSpan.textContent = sheet.title;
        const snippet = document.createElement('span');
        snippet.className = 'sheet-snippet';
        snippet.textContent = sheet.drafts[0]?.revisions[0] || sheet.synopsis;
        const meta = document.createElement('span');
        meta.className = 'sheet-meta';
        if (sheet.adopted !== null) {
          const dot = document.createElement('span');
          dot.className = 'adopted-dot';
          dot.setAttribute('aria-label', '已采用');
          meta.append(dot);
        }
        const date = document.createElement('span');
        date.textContent = sheet.date;
        const candidates = document.createElement('span');
        candidates.className = 'candidate-count';
        candidates.textContent = sheet.diary ? '日记' : sheet.drafts.length ? `${sheet.drafts.length} 稿` : '待写';
        meta.append(date, candidates);
        button.append(titleSpan, snippet, meta);
        button.addEventListener('click', () => selectSheet(sheet));
        li.append(button);
        $('sheet-list').append(li);
      }
      $('empty-list').hidden = rows.length > 0;
      $('list-footer').textContent = `${rows.length} ${group === 'diaries' ? '篇日记' : '幕'} · ${rows.filter(sheet => sheet.drafts.length).length} 份成稿`;
      document.querySelectorAll('[data-group]').forEach(button => {
        if (button.dataset.group === group) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
    }
    function renderParagraphs(element, body) {
      element.replaceChildren();
      body.split(/\n\s*\n/).filter(Boolean).forEach((text, index) => {
        const paragraph = document.createElement('p');
        paragraph.textContent = text;
        paragraph.dataset.paragraph = index + 1;
        element.append(paragraph);
      });
    }
    function renderEditor() {
      const draft = currentDraft();
      document.title = `${selected.title} · Sth 样稿`;
      $('crumb-book').textContent = selected.book;
      $('crumb-chapter').textContent = selected.chapter;
      $('manuscript-title').textContent = selected.title;
      $('manuscript-meta').replaceChildren();
      const isAdoptedRevision = selected.adopted === draftIndex && revision === 1;
      for (const text of [selected.diary ? '个人日记' : isAdoptedRevision ? '已采用稿' : '候选稿', `第 ${revision} 版`, '示例正文']) {
        const span = document.createElement('span');
        span.textContent = text;
        if (text === '已采用稿') span.className = 'state';
        $('manuscript-meta').append(span);
      }
      $('draft').replaceChildren(...selected.drafts.map((item, index) => new Option(item.name, index)));
      $('draft').value = draftIndex;
      $('draft').disabled = !draft;
      $('revision').replaceChildren(...(draft?.revisions || []).map((_, index) => new Option(`第 ${index + 1} 版`, index + 1)));
      $('revision').value = revision;
      $('revision').disabled = !draft;
      $('old-version').hidden = !draft || revision === draft.revisions.length;
      $('old-version-label').textContent = `历史版本 · 第 ${revision} 版`;
      $('selection-note').hidden = true;
      $('word-count').textContent = `${currentBody().replace(/\s/g, '').length} 字 · ${draft ? currentBody().split(/\n\s*\n/).filter(Boolean).length : 0} 段`;
      $('save-state').textContent = '示例正文 · 仅保存在此浏览器';
      $('compare').disabled = selected.drafts.length < 2;
      $('edit').disabled = !draft;
      $('manuscript-body').hidden = false;
      $('edit-body').hidden = true;
      $('edit').hidden = false;
      $('save').hidden = $('cancel-edit').hidden = true;
      $('draft').disabled = $('revision').disabled = !draft;
      renderParagraphs($('manuscript-body'), currentBody());
      if (!draft) {
        const empty = document.createElement('div');
        empty.className = 'no-manuscript';
        const p = document.createElement('p');
        p.textContent = selected.synopsis || '这一幕还没有正文。';
        const button = document.createElement('button');
        button.className = 'text-button primary';
        button.textContent = '开始写这一幕';
        button.addEventListener('click', () => {
          selected.drafts.push(makeDraft('稿一', [''], false));
          draftIndex = 0;
          revision = 1;
          renderEditor();
          startEditing();
        });
        empty.append(p, button);
        $('manuscript-body').append(empty);
        $('manuscript-meta').textContent = '未采用 · 等待第一份稿件';
      }
      if (Object.hasOwn(saved.drafts, draftKey())) $('save-state').textContent = '有未保存的本地草稿 · 点编辑恢复';
      renderEvidence();
      if ($('workspace').dataset.compare === 'true') {
        if (selected.drafts.length > 1) renderComparison();
        else closeComparison();
      }
      requestAnimationFrame(() => { $('reading-scroll').scrollTop = scrollPositions.get(`${draftKey()}/${revision}`) || 0; });
    }
    function selectSheet(sheet, push = true) {
      rememberScroll();
      putDraftAside();
      selected = sheet;
      draftIndex = 0;
      revision = sheet.drafts[0]?.revisions.length || 1;
      setPane('editor');
      $('workspace').dataset.library = 'closed';
      renderList();
      renderEditor();
      syncAddress(push);
      if (narrow()) $('manuscript-title').focus({ preventScroll: true });
    }
    function startEditing() {
      if (!currentDraft()) return;
      editing = true;
      $('edit-body').value = saved.drafts[draftKey()] ?? currentBody();
      $('manuscript-body').hidden = true;
      $('edit-body').hidden = false;
      $('edit').hidden = true;
      $('save').hidden = $('cancel-edit').hidden = false;
      $('save-state').textContent = '正在编辑本地示例';
      $('edit-body').focus({ preventScroll: true });
    }
    function saveEdit() {
      if (!editing || !currentDraft()) return;
      const value = $('edit-body').value;
      if (!value.trim()) { announce('正文还是空的，写下一句话再保存。'); return; }
      if (value !== currentBody()) {
        currentDraft().revisions.push(value);
        const base = seedSheets.find(sheet => sheet.id === selected.id)?.drafts[draftIndex]?.revisions.length || 0;
        saved.revisions[draftKey()] = currentDraft().revisions.slice(base);
        revision = currentDraft().revisions.length;
      }
      delete saved.drafts[draftKey()];
      if (!seedSheets.some(sheet => sheet.id === selected.id)) {
        saved.created = (Array.isArray(saved.created) ? saved.created : []).filter(sheet => sheet.id !== selected.id);
        saved.created.push(clone(selected));
        delete saved.revisions[draftKey()];
      }
      const persisted = persist();
      editing = false;
      renderList();
      renderEditor();
      syncAddress();
      if (persisted) announce(`第 ${revision} 版已保存到此浏览器`);
    }
    function evidenceSection(iconName, title, content) {
      return `<section class="evidence-section"><h3>${icon(iconName)}${title}</h3>${content}</section>`;
    }
    function renderEvidence() {
      const container = $('evidence-content');
      container.replaceChildren();
      const context = document.createElement('p');
      context.className = 'evidence-context';
      context.textContent = `${selected.title} · ${currentDraft()?.name || '待写'} · 第 ${revision} 版`;
      container.append(context);
      const details = document.createElement('div');
      if (!currentDraft()?.evidence) {
        details.innerHTML = '<div class="evidence-section"><h3>这份稿件没有记录依据</h3><p>可以继续读稿。关闭后会回到刚才的段落。</p></div>';
      } else if (selected.diary) {
        details.innerHTML = evidenceSection('book', '阅读摘记 · 第 1 版', '<blockquote>先看清一个细节，再决定从哪里开始讲述。</blockquote><p class="evidence-source">《慢慢写》 · 示例摘句</p>');
      } else {
        const quotes = [
          ['物件笔记 · 第 1 版', '东西只要还找得到原来的顺序，就不算真的丢了。', '先保留日常动作，让铁盒带出回忆。'],
          ['信件笔记 · 第 2 版', '有些信的意义，在于收信的人终于愿意打开它。', '从信封的折痕开始，把钟声放到第二段。'],
          ['楼上视角 · 第 1 版', '等候的人记得每一种脚步声，却总不敢先开门。', '只写楼上的人能够听见与看见的事。']
        ][draftIndex % 3];
        details.innerHTML = evidenceSection('book', '原文资料', '<blockquote></blockquote><p class="evidence-source"></p><details><summary>展开示例原文</summary><p>她在整理旧物时记下这句话，后来把笔记夹在一本没有封面的书里。原句随这份候选稿固定到所示版本。</p></details>')
          + evidenceSection('person', '人物设定', '<p><strong>林遥</strong> · 第 2 版</p><p>回到故乡的整理师。习惯先观察物件，再开口询问；对久别重逢保持克制。</p>')
          + evidenceSection('check', '作者决定', '<p class="decision-text"></p><p class="evidence-source">已确认 · 主线 · 示例记录</p>')
          + evidenceSection('note', '写作准备', '<details><summary>查看完整示例提示词</summary><p>用贴近人物的第三人称写一个傍晚的片段。保持日常语气，以物件和动作推进。结尾保留下一幕的入口。</p></details>');
        details.querySelector('blockquote').textContent = quotes[1];
        details.querySelector('.evidence-source').textContent = quotes[0];
        details.querySelector('.decision-text').textContent = quotes[2];
      }
      const footnote = document.createElement('p');
      footnote.className = 'evidence-footnote';
      footnote.textContent = '正文、资料、人物和决定均为样稿示例。依据在本样稿中按候选稿展示。';
      container.append(details, footnote);
    }
    function closeEvidence() {
      $('workspace').dataset.evidence = 'false';
      $('evidence').hidden = true;
      $('evidence-toggle').setAttribute('aria-pressed', 'false');
      evidenceFocus?.focus({ preventScroll: true });
    }
    function toggleEvidence(event) {
      if ($('workspace').dataset.evidence === 'true') return closeEvidence();
      closeComparison();
      evidenceFocus = event?.currentTarget instanceof HTMLElement ? event.currentTarget : document.activeElement;
      $('workspace').dataset.evidence = 'true';
      $('evidence').hidden = false;
      $('evidence-toggle').setAttribute('aria-pressed', 'true');
      $('evidence-title').focus({ preventScroll: true });
    }
    function renderComparison() {
      comparisonIndex = comparisonIndex === draftIndex || comparisonIndex >= selected.drafts.length ? (draftIndex + 1) % selected.drafts.length : comparisonIndex;
      $('compare-draft').replaceChildren(...selected.drafts.map((draft, index) => new Option(draft.name, index)));
      $('compare-draft').value = comparisonIndex;
      const draft = selected.drafts[comparisonIndex];
      $('compare-title').textContent = selected.title;
      $('compare-meta').textContent = `${draft.name} · 第 ${draft.revisions.length} 版 · 示例正文`;
      renderParagraphs($('compare-body'), draft.revisions.at(-1));
    }
    function closeComparison() {
      $('workspace').dataset.compare = 'false';
      $('compare-pane').hidden = true;
      $('compare').setAttribute('aria-pressed', 'false');
    }
    function toggleFocus() {
      const active = $('workspace').dataset.focus !== 'true';
      $('workspace').dataset.focus = String(active);
      $('focus').setAttribute('aria-pressed', String(active));
      $('focus').title = active ? '退出专注（F / Esc）' : '专注阅读（F）';
      $('focus').querySelector('.button-label').textContent = active ? '退出专注' : '专注';
    }
    function toggleFont() {
      const sans = $('workspace').classList.toggle('sans');
      $('font-toggle').querySelector('span').textContent = sans ? '改用宋体正文' : '改用无衬线正文';
      $('font-footer').textContent = `${sans ? '无衬线' : '宋体'} · 18`;
      $('more-menu').open = false;
    }
    function toggleLibrary() {
      const workspace = $('workspace');
      if (narrow()) { closeEvidence(); setPane('library'); return; }
      if (matchMedia('(max-width: 1099px)').matches) {
        workspace.dataset.library = workspace.dataset.library === 'open' ? 'closed' : 'open';
        $('show-library').setAttribute('aria-expanded', String(workspace.dataset.library === 'open'));
      } else {
        if (workspace.dataset.focus === 'true') toggleFocus();
        closeComparison();
        closeEvidence();
        workspace.dataset.library = workspace.dataset.library === 'hidden' ? 'visible' : 'hidden';
      }
      $('more-menu').open = false;
    }
    function locatePassage(number, writeAddress = false) {
      const paragraph = $('manuscript-body').querySelector(`[data-paragraph="${number}"]`);
      if (!paragraph) return;
      $('manuscript-body').querySelectorAll('.target').forEach(p => p.classList.remove('target'));
      paragraph.classList.add('target');
      $('selection-note').hidden = false;
      setPane('editor');
      requestAnimationFrame(() => paragraph.scrollIntoView({ block: 'center' }));
      if (writeAddress) {
        const url = new URL(location.href);
        url.searchParams.set('passage', number);
        try { history.replaceState({}, '', url); } catch { /* Optional URL state. */ }
      }
    }
    document.querySelectorAll('[data-group]').forEach(button => button.addEventListener('click', () => {
      group = button.dataset.group;
      $('search').value = '';
      filtering = false;
      $('filter-adopted').setAttribute('aria-pressed', 'false');
      $('filter-adopted').firstChild.textContent = '全部文稿';
      $('workspace').dataset.library = 'closed';
      $('show-library').setAttribute('aria-expanded', 'false');
      setPane('list');
      renderList();
      if (!narrow()) {
        const first = groupSheets()[0];
        if (first && !groupSheets().includes(selected)) selectSheet(first);
      }
    }));
    $('search').addEventListener('input', renderList);
    $('filter-adopted').addEventListener('click', () => {
      filtering = !filtering;
      $('filter-adopted').setAttribute('aria-pressed', String(filtering));
      $('filter-adopted').firstChild.textContent = filtering ? '只看已采用' : '全部文稿';
      renderList();
    });
    $('draft').addEventListener('change', event => {
      rememberScroll();
      putDraftAside();
      draftIndex = Number(event.target.value);
      revision = currentDraft().revisions.length;
      renderEditor();
      syncAddress(true);
    });
    $('revision').addEventListener('change', event => {
      rememberScroll();
      putDraftAside();
      revision = Number(event.target.value);
      renderEditor();
      syncAddress(true);
    });
    $('latest').addEventListener('click', () => {
      putDraftAside();
      revision = currentDraft().revisions.length;
      renderEditor();
      syncAddress();
    });
    $('edit').addEventListener('click', startEditing);
    $('save').addEventListener('click', saveEdit);
    $('edit-body').addEventListener('input', () => {
      saved.drafts[draftKey()] = $('edit-body').value;
      const persisted = persist();
      $('save-state').textContent = persisted ? '未保存 · 本地草稿已暂存' : '未保存 · 暂存在此页面';
    });
    $('cancel-edit').addEventListener('click', () => {
      delete saved.drafts[draftKey()];
      persist();
      editing = false;
      renderEditor();
    });
    $('focus').addEventListener('click', toggleFocus);
    $('evidence-toggle').addEventListener('click', toggleEvidence);
    $('evidence-close').addEventListener('click', closeEvidence);
    $('font-toggle').addEventListener('click', toggleFont);
    $('font-footer').addEventListener('click', toggleFont);
    $('hide-library').addEventListener('click', toggleLibrary);
    $('show-library').addEventListener('click', toggleLibrary);
    $('layout-toggle').addEventListener('click', toggleLibrary);
    $('back-library').addEventListener('click', () => { setPane('library'); });
    $('back-list').addEventListener('click', () => { rememberScroll(); putDraftAside(); setPane('list'); });
    $('selection-link').addEventListener('click', () => { $('more-menu').open = false; locatePassage(3, true); });
    $('clear-selection').addEventListener('click', () => {
      $('manuscript-body').querySelectorAll('.target').forEach(p => p.classList.remove('target'));
      $('selection-note').hidden = true;
      syncAddress();
    });
    $('compare').addEventListener('click', () => {
      if ($('workspace').dataset.compare === 'true') return closeComparison();
      closeEvidence();
      $('workspace').dataset.compare = 'true';
      $('compare-pane').hidden = false;
      $('compare').setAttribute('aria-pressed', 'true');
      renderComparison();
    });
    $('compare-draft').addEventListener('change', event => {
      comparisonIndex = Number(event.target.value);
      renderComparison();
    });
    $('compare-close').addEventListener('click', closeComparison);
    $('new-sheet').addEventListener('click', () => {
      const sheet = { id: `new-${Date.now()}`, title: group === 'diaries' ? '今天的日记' : '未命名文稿', group: ['recent', 'novel'].includes(group) ? 'unfiled' : group, book: group === 'diaries' ? '日记' : group === 'night' ? '夜航札记' : '北港来信', chapter: groupLabels[group][0], date: '刚刚', adopted: null, diary: group === 'diaries', drafts: [makeDraft('稿一', [''], false)] };
      sheets.push(sheet);
      if (['recent', 'novel'].includes(group)) group = 'unfiled';
      selectSheet(sheet);
      startEditing();
      announce('已新建临时示例文稿');
    });
    $('reset').addEventListener('click', () => {
      try { localStorage.removeItem(storageKey); } catch { /* Optional storage. */ }
      saved = { revisions: {}, drafts: {}, created: [] };
      sheets = clone(seedSheets);
      selected = sheets[0];
      group = 'chapter2';
      draftIndex = 0;
      revision = 1;
      editing = false;
      closeEvidence();
      closeComparison();
      $('more-menu').open = false;
      renderList();
      renderEditor();
      syncAddress();
      announce('已恢复第一版示例');
    });
    document.addEventListener('pointerdown', event => {
      if (!$('more-menu').contains(event.target)) $('more-menu').open = false;
      if ($('workspace').dataset.library === 'open' && !event.target.closest('.library, #show-library')) {
        $('workspace').dataset.library = 'closed';
        $('show-library').setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('keydown', event => {
      const input = event.target.closest('input, textarea, select, [contenteditable="true"]');
      if ((event.ctrlKey || event.metaKey) && event.key === 's' && editing) { event.preventDefault(); saveEdit(); }
      if (event.key === 'Escape') {
        if ($('more-menu').open) $('more-menu').open = false;
        else if ($('workspace').dataset.evidence === 'true') closeEvidence();
        else if ($('workspace').dataset.compare === 'true') closeComparison();
        else if ($('workspace').dataset.focus === 'true') toggleFocus();
        else if ($('workspace').dataset.library === 'open') $('workspace').dataset.library = 'closed';
        return;
      }
      if (input || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.key.toLowerCase() === 'f') toggleFocus();
      if (event.key.toLowerCase() === 'e') toggleEvidence();
      if (event.key === '/') { event.preventDefault(); setPane('list'); $('search').focus(); }
    });
    addEventListener('popstate', () => {
      putDraftAside();
      const params = new URLSearchParams(location.search);
      selected = sheets.find(sheet => sheet.id === params.get('sheet')) || sheets[0];
      group = Object.hasOwn(groupLabels, params.get('group')) ? params.get('group') : selected.group;
      draftIndex = Math.max(0, Math.min(selected.drafts.length - 1, Number(params.get('draft')) || 0));
      revision = Math.max(1, Math.min(currentDraft()?.revisions.length || 1, Number(params.get('revision')) || 1));
      setPane('editor');
      renderList();
      renderEditor();
      if (params.has('passage')) requestAnimationFrame(() => locatePassage(Number(params.get('passage'))));
    });
    addEventListener('pagehide', putDraftAside);
    renderList();
    renderEditor();
    if (narrow()) setPane(initial.has('sheet') || initial.has('passage') ? 'editor' : 'library');
    if (initial.get('focus') === '1') toggleFocus();
    if (initial.get('evidence') === '1') toggleEvidence();
    if (initial.get('font') === 'sans') toggleFont();
    if (initial.has('passage')) requestAnimationFrame(() => locatePassage(Number(initial.get('passage'))));
    if (initial.has('start') && initial.has('end')) {
      const start = Number(initial.get('start'));
      const end = Number(initial.get('end'));
      if (Number.isSafeInteger(start) && Number.isSafeInteger(end) && start >= 0 && end > start && end <= currentBody().length) {
        const before = currentBody().slice(0, start);
        requestAnimationFrame(() => locatePassage(before.split(/\n\s*\n/).length));
      }
    }
  </script>
</body>
</html>
